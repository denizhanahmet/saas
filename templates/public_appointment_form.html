{% extends "base.html" %} {% block title %}Randevu Talep Formu{% endblock %} {% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white text-center">
                    <h4 class="mb-0">
                        <i class="bi bi-calendar-plus"></i> Randevu Talep Formu
                    </h4>
                    <div class="mt-2">
                        <span class="badge bg-info">
                            Eğitmen: {{ user.first_name|default('') }} {{ user.last_name|default('') }}
                        </span>
                    </div>
                </div>
                <div class="card-body p-4">
                    <form method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                        <div class="mb-3">
                            <label for="name" class="form-label">Ad Soyad *</label>
                            <input type="text" class="form-control" id="name" name="name" required>
                        </div>
                        <div class="mb-3">
                            <label for="phone" class="form-label">Telefon *</label>
                            <input type="text" class="form-control" id="phone" name="phone" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">E-posta</label>
                            <input type="email" class="form-control" id="email" name="email">
                        </div>
                        <div class="mb-3">
                            <label for="appointment_date" class="form-label">Tarih *</label>
                            <input type="date" class="form-control" id="appointment_date" name="appointment_date"
                                value="{{ appointment.appointment_date if appointment and appointment.appointment_date else '' }}"
                                required>
                        </div>
                        <div class="mb-3">
                            <label for="appointment_time" class="form-label">Saat *</label>
                            <input type="time" class="form-control" id="appointment_time" name="appointment_time"
                                value="{% if appointment and appointment.appointment_time %}{% if appointment.appointment_time.strftime is defined %}{{ appointment.appointment_time.strftime('%H:%M') }}{% else %}{{ appointment.appointment_time }}{% endif %}{% else %}{% endif %}"
                                required>
                        </div>
                        <div class="mb-3">
                            <label for="note" class="form-label">Not (isteğe bağlı)</label>
                            <textarea class="form-control" id="note" name="note" rows="2"></textarea>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary"
                                style="background-color:#0d6efd !important;color:#fff !important;border:2px solid #0d6efd !important;min-height:44px;font-weight:700;border-radius:8px;width:100%;box-shadow:0 2px 8px rgba(13,110,253,0.08);display:block;">
                                <i class="bi bi-send"></i> Randevu Talebi Gönder
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
