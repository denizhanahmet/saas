{% extends "base.html" %}
{% block title %}Takvim{% endblock %}
{% block content %}
<div class="w-full max-w-5xl mx-auto bg-white rounded-xl shadow-lg p-8 border border-gray-200 mt-8">
    <div class="flex flex-col md:flex-row md:items-center justify-between mb-6 gap-4">
        <h2 class="text-2xl font-bold text-blue-700 flex items-center gap-2"><span
                class="material-icons align-middle">calendar_today</span>Takvim Görünümü</h2>
        <div class="flex gap-2">
            <a href="{{ url_for('dashboard.appointments') }}"
                class="px-6 py-2 rounded bg-gray-200 text-gray-700 font-semibold hover:bg-gray-300 transition flex items-center gap-2"><span
                    class="material-icons align-middle">list</span>Liste Görünümü</a>
            <a href="{{ url_for('appointments.create') }}"
                class="px-6 py-2 rounded bg-green-600 text-white font-semibold hover:bg-green-700 transition flex items-center gap-2"><span
                    class="material-icons align-middle">add</span>Yeni Randevu</a>
        </div>
    </div>
    <div class="bg-white rounded-lg border border-gray-100 p-4">
        <div id="calendar"></div>
    </div>
</div>
<!-- Randevu Detay Modal -->
<div class="modal fade" id="appointmentModal" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="appointmentModalTitle">Randevu Detayı</h5>
                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span>
                </button>
            </div>
            <div class="modal-body" id="appointmentModalBody">
                <!-- İçerik JavaScript ile doldurulacak -->
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Kapat</button>
                <a href="#" class="btn btn-primary" id="editAppointmentBtn">Düzenle</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        var calendarEl = document.getElementById('calendar');
        var calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            locale: 'tr',
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth,timeGridWeek,timeGridDay'
            },
            events: [{
                %
                for appointment in appointments %
            } {
            id: '{{ appointment.id }}',
            title: '{{ appointment.title }}',
            start: '{{ appointment.appointment_date }}T{% if appointment.appointment_time and appointment.appointment_time.strftime is defined %}{{ appointment.appointment_time.strftime("%H:%M") }}{% elif appointment.appointment_time %}{{ appointment.appointment_time }}{% endif %}',
            end: '{{ appointment.appointment_date }}T{{ (appointment.get_datetime() + timedelta(minutes=appointment.duration)).strftime("%H:%M") }}',
            backgroundColor: '{% if appointment.status == "scheduled" %}#007bff{% elif appointment.status == "completed" %}#28a745{% else %}#dc3545{% endif %}',
            borderColor: '{% if appointment.status == "scheduled" %}#007bff{% elif appointment.status == "completed" %}#28a745{% else %}#dc3545{% endif %}',
            textColor: 'white',
            extendedProps: {
                description: '{{ appointment.description or "" }}',
                location: '{{ appointment.location or "" }}',
                client: '{% if appointment.client %}{{ appointment.client.name }}{% endif %}',
                status: '{{ appointment.status }}',
                duration: '{{ appointment.duration }}'
            }
        } {
                %
                if not loop.last %
            }, {
                % endif %
            } {
                % endfor %
            }],
        eventClick: function (info) {
            var appointment = info.event;
            var extendedProps = appointment.extendedProps;

            document.getElementById('appointmentModalTitle').textContent = appointment.title;
            document.getElementById('editAppointmentBtn').href = '/dashboard/appointment/' + appointment.id + '/edit';

            var modalBody = document.getElementById('appointmentModalBody');
            modalBody.innerHTML = `
                <div class="row">
                    <div class="col-md-6">
                        <strong>Tarih:</strong><br>
                        ${appointment.start.toLocaleDateString('tr-TR')}
                    </div>
                    <div class="col-md-6">
                        <strong>Saat:</strong><br>
                        ${appointment.start.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' })}
                    </div>
                </div>
                <hr>
                <div class="row">
                    <div class="col-md-6">
                        <strong>Süre:</strong><br>
                        ${extendedProps.duration} dakika
                    </div>
                    <div class="col-md-6">
                        <strong>Durum:</strong><br>
                        <span class="badge ${appointment.backgroundColor === '#007bff' ? 'bg-primary' : appointment.backgroundColor === '#28a745' ? 'bg-success' : 'bg-danger'}">
                            ${extendedProps.status === 'scheduled' ? 'Planlandı' : extendedProps.status === 'completed' ? 'Tamamlandı' : 'İptal Edildi'}
                        </span>
                    </div>
                </div>
                ${extendedProps.client ? `
                <hr>
                <div class="row">
                    <div class="col-12">
                        <strong>Müşteri:</strong><br>
                        ${extendedProps.client}
                    </div>
                </div>
                ` : ''}
                ${extendedProps.location ? `
                <hr>
                <div class="row">
                    <div class="col-12">
                        <strong>Konum:</strong><br>
                        ${extendedProps.location}
                    </div>
                </div>
                ` : ''}
                ${extendedProps.description ? `
                <hr>
                <div class="row">
                    <div class="col-12">
                        <strong>Açıklama:</strong><br>
                        ${extendedProps.description}
                    </div>
                </div>
                ` : ''}
            `;

            $('#appointmentModal').modal('show');
        }
        });

    calendar.render();
    });
</script>
{% endblock %}
