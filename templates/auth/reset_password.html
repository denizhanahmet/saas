{% extends "base.html" %}
{% block title %}Şifre Yenileme{% endblock %}
{% block content %}
<div class="w-full max-w-md mx-auto bg-white rounded-xl shadow-lg p-8 border border-gray-200 mt-12">
    <h2 class="text-2xl font-bold text-center text-blue-700 mb-6">Şifre Yenileme</h2>
    <form method="POST" class="space-y-5">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        <div>
            <label for="new_password" class="block text-gray-700 font-medium mb-1">Yeni Şifre</label>
            <input type="password" id="new_password" name="new_password" required
                class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400" />
        </div>
        <div>
            <label for="confirm_password" class="block text-gray-700 font-medium mb-1">Yeni Şifre (Tekrar)</label>
            <input type="password" id="confirm_password" name="confirm_password" required
                class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400" />
        </div>
        <button type="submit"
            class="w-full py-2 rounded bg-blue-600 text-white font-semibold hover:bg-blue-700 transition flex items-center justify-center gap-2">
            <span class="material-icons align-middle">vpn_key</span>
            Şifreyi Güncelle
        </button>
    </form>
</div>
{% endblock %}
