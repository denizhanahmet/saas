{% extends "base.html" %}
{% block title %}Şifre Yenileme{% endblock %}
{% block content %}
<div
    class="w-full max-w-md mx-auto bg-white dark:bg-gray-800 rounded-xl shadow-lg p-8 border border-gray-200 dark:border-gray-700 mt-12 transition-colors duration-200">
    <h2 class="text-2xl font-bold text-center text-blue-700 dark:text-blue-400 mb-6">Şifre Yenileme</h2>
    <form method="POST" class="space-y-5">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        <div>
            <label for="new_password" class="block text-gray-700 dark:text-gray-300 font-medium mb-1">Yeni Şifre</label>
            <div class="relative">
                <input type="password" id="new_password" name="new_password" required
                    class="w-full px-4 py-2 pr-10 border border-gray-300 dark:border-gray-600 rounded focus:outline-none focus:ring-2 focus:ring-blue-400 bg-white dark:bg-gray-700 text-gray-900 dark:text-white" />
                <button type="button" onclick="togglePassword('new_password', this)"
                    class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 transition">
                    <span class="material-icons text-xl">visibility_off</span>
                </button>
            </div>
        </div>
        <div>
            <label for="confirm_password" class="block text-gray-700 dark:text-gray-300 font-medium mb-1">Yeni Şifre
                (Tekrar)</label>
            <div class="relative">
                <input type="password" id="confirm_password" name="confirm_password" required
                    class="w-full px-4 py-2 pr-10 border border-gray-300 dark:border-gray-600 rounded focus:outline-none focus:ring-2 focus:ring-blue-400 bg-white dark:bg-gray-700 text-gray-900 dark:text-white" />
                <button type="button" onclick="togglePassword('confirm_password', this)"
                    class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 transition">
                    <span class="material-icons text-xl">visibility_off</span>
                </button>
            </div>
        </div>
        <button type="submit"
            class="w-full py-2 rounded bg-blue-600 text-white font-semibold hover:bg-blue-700 transition flex items-center justify-center gap-2">
            <span class="material-icons align-middle">vpn_key</span>
            Şifreyi Güncelle
        </button>
    </form>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    function togglePassword(inputId, button) {
        const input = document.getElementById(inputId);
        const icon = button.querySelector('.material-icons');
        if (input.type === 'password') {
            input.type = 'text';
            icon.textContent = 'visibility';
        } else {
            input.type = 'password';
            icon.textContent = 'visibility_off';
        }
    }
</script>
{% endblock %}
