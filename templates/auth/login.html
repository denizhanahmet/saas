{% extends "base.html" %}
{% block title %}Giriş Yap - Randevu Sistemi{% endblock %}
{% block content %}
<div class="w-full max-w-md mx-auto bg-white rounded-xl shadow-lg p-8 border border-gray-200">
    <h2 class="text-2xl font-bold text-center text-blue-700 mb-6">Giriş Yap</h2>
    <form method="POST" action="{{ url_for('auth.login') }}" class="space-y-5">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        <div>
            <label for="email" class="block text-gray-700 font-medium mb-1">Email</label>
            <input type="email" id="email" name="email" required value="{{ request.form.email if request.form.email }}"
                class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400" />
        </div>
        <div>
            <label for="password" class="block text-gray-700 font-medium mb-1">Şifre</label>
            <input type="password" id="password" name="password" required
                class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400" />
        </div>
        <div class="flex items-center">
            <input type="checkbox" id="remember" name="remember" class="mr-2">
            <label for="remember" class="text-gray-600">Beni hatırla</label>
        </div>
        <button type="submit"
            class="w-full py-2 rounded bg-blue-600 text-white font-semibold hover:bg-blue-700 transition">Giriş
            Yap</button>
    </form>
    <div class="text-center mt-4">
        <a href="{{ url_for('auth.forgot_password') }}" class="text-blue-600 hover:underline">Şifremi Unuttum</a>
    </div>
    <div class="my-6 border-t"></div>
    <div class="text-center">
        <p class="mb-2 text-gray-600">Hesabınız yok mu?</p>
        <a href="{{ url_for('auth.register') }}"
            class="inline-block px-6 py-2 rounded bg-blue-50 text-blue-700 font-semibold border border-blue-600 hover:bg-blue-100 transition">Kayıt
            Ol</a>
    </div>
</div>
{% endblock %}
