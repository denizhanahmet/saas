{% extends "base.html" %}
{% block title %}Giriş Yap - Randevu Sistemi{% endblock %}

{% block content %}
<div class="w-full max-w-md mx-auto px-4">
    <!-- Login Card -->
    <div class="card-modern p-8 animate-fade-in-up">
        <!-- Header -->
        <div class="text-center mb-8">
            <div
                class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-gradient-to-br from-blue-500 to-blue-600 flex items-center justify-center shadow-lg">
                <span class="material-icons text-3xl text-white">lock_open</span>
            </div>
            <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Hoş Geldiniz</h1>
            <p class="text-gray-500 dark:text-gray-400 mt-1">Hesabınıza giriş yapın</p>
        </div>

        <!-- Form -->
        <form method="POST" action="{{ url_for('auth.login') }}" class="space-y-5">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

            <!-- Email -->
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                    Email Adresi
                </label>
                <div class="relative">
                    <span
                        class="absolute left-3 top-1/2 -translate-y-1/2 material-icons text-gray-400 text-xl">mail</span>
                    <input type="email" id="email" name="email" required
                        value="{{ request.form.email if request.form.email }}" placeholder="ornek@email.com"
                        class="input-modern pl-11" />
                </div>
            </div>

            <!-- Password -->
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                    Şifre
                </label>
                <div class="relative">
                    <span
                        class="absolute left-3 top-1/2 -translate-y-1/2 material-icons text-gray-400 text-xl">lock</span>
                    <input type="password" id="password" name="password" required placeholder="••••••••"
                        class="input-modern pl-11 pr-11" />
                    <button type="button" onclick="togglePassword('password', this)"
                        class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 transition">
                        <span class="material-icons text-xl">visibility_off</span>
                    </button>
                </div>
            </div>

            <!-- Remember & Forgot -->
            <div class="flex items-center justify-between">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" id="remember" name="remember"
                        class="w-4 h-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                    <span class="text-sm text-gray-600 dark:text-gray-400">Beni hatırla</span>
                </label>
                <a href="{{ url_for('auth.forgot_password') }}"
                    class="text-sm text-blue-600 dark:text-blue-400 hover:underline">
                    Şifremi Unuttum
                </a>
            </div>

            <!-- Submit -->
            <button type="submit" class="btn-modern btn-primary-modern w-full py-3">
                <span class="material-icons text-xl">login</span>
                Giriş Yap
            </button>
        </form>

        <!-- Divider -->
        <div class="relative my-8">
            <div class="absolute inset-0 flex items-center">
                <div class="w-full border-t border-gray-200 dark:border-gray-700"></div>
            </div>
            <div class="relative flex justify-center text-sm">
                <span class="px-4 bg-white dark:bg-gray-800 text-gray-500 dark:text-gray-400">
                    veya
                </span>
            </div>
        </div>

        <!-- Register Link -->
        <div class="text-center">
            <p class="text-gray-600 dark:text-gray-400 mb-3">Hesabınız yok mu?</p>
            <a href="{{ url_for('auth.register') }}" class="btn-modern btn-secondary-modern w-full">
                <span class="material-icons text-xl">person_add</span>
                Yeni Hesap Oluştur
            </a>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    function togglePassword(inputId, button) {
        const input = document.getElementById(inputId);
        const icon = button.querySelector('.material-icons');
        if (input.type === 'password') {
            input.type = 'text';
            icon.textContent = 'visibility';
        } else {
            input.type = 'password';
            icon.textContent = 'visibility_off';
        }
    }
</script>
{% endblock %}
