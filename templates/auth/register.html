{% extends "base.html" %}
{% block title %}Kayıt Ol - Randevu Sistemi{% endblock %}
{% block content %}
<div class="w-full max-w-lg mx-auto bg-white rounded-xl shadow-lg p-8 border border-gray-200">
    <h2 class="text-2xl font-bold text-center text-blue-700 mb-6">Kayıt Ol</h2>
    <form method="POST" action="{{ url_for('auth.register') }}" class="space-y-5">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        <div class="flex gap-4">
            <div class="w-1/2">
                <label for="first_name" class="block text-gray-700 font-medium mb-1">Ad</label>
                <input type="text" id="first_name" name="first_name" required
                    value="{{ request.form.first_name if request.form.first_name }}"
                    class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400" />
            </div>
            <div class="w-1/2">
                <label for="last_name" class="block text-gray-700 font-medium mb-1">Soyad</label>
                <input type="text" id="last_name" name="last_name" required
                    value="{{ request.form.last_name if request.form.last_name }}"
                    class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400" />
            </div>
        </div>
        <!-- Kullanıcı adı alanı kaldırıldı -->
        <div>
            <label for="email" class="block text-gray-700 font-medium mb-1">Email</label>
            <input type="email" id="email" name="email" required value="{{ request.form.email if request.form.email }}"
                class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400" />
        </div>
        <div>
            <label for="phone" class="block text-gray-700 font-medium mb-1">Telefon (Opsiyonel)</label>
            <input type="tel" id="phone" name="phone" value="{{ request.form.phone if request.form.phone }}"
                class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400" />
        </div>
        <div>
            <label for="password" class="block text-gray-700 font-medium mb-1">Şifre</label>
            <input type="password" id="password" name="password" required
                class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400" />
            <div class="text-xs text-gray-400 mt-1">En az 6 karakter olmalıdır.</div>
        </div>
        <div>
            <label for="confirm_password" class="block text-gray-700 font-medium mb-1">Şifre Tekrar</label>
            <input type="password" id="confirm_password" name="confirm_password" required
                class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400" />
        </div>
        <div class="flex items-center gap-2">
            <input type="checkbox" id="kvkkCheck" name="kvkkCheck" class="mr-2">
            <label for="kvkkCheck" class="text-gray-600 text-sm"> <a href="/kvkk" target="_blank"
                    class="text-blue-600 underline font-medium">Gizlilik ve KVKK hüküm ve koşullarını kabul
                    ediyorum</a></label>
        </div>
        <button type="submit"
            class="w-full py-2 rounded bg-green-600 text-white font-semibold hover:bg-green-700 transition"
            id="registerBtn" disabled>Kayıt Ol</button>
    </form>
    <div class="my-6 border-t"></div>
    <div class="text-center">
        <p class="mb-2 text-gray-600">Zaten hesabınız var mı?</p>
        <a href="{{ url_for('auth.login') }}"
            class="inline-block px-6 py-2 rounded bg-blue-50 text-blue-700 font-semibold border border-blue-600 hover:bg-blue-100 transition">Giriş
            Yap</a>
    </div>
</div>
{% endblock %}
{% block extra_scripts %}
<script>
    document.getElementById('password').addEventListener('input', function () {
        const password = this.value;
        const confirmPassword = document.getElementById('confirm_password');
        if (password.length > 0) {
            confirmPassword.required = true;
        } else {
            confirmPassword.required = false;
        }
    });
    document.getElementById('confirm_password').addEventListener('input', function () {
        const password = document.getElementById('password').value;
        const confirmPassword = this.value;
        if (confirmPassword !== password) {
            this.setCustomValidity('Şifreler eşleşmiyor');
        } else {
            this.setCustomValidity('');
        }
    });
    // KVKK checkbox kontrolü
    const kvkkCheck = document.getElementById('kvkkCheck');
    const registerBtn = document.getElementById('registerBtn');
    kvkkCheck.addEventListener('change', function () {
        registerBtn.disabled = !this.checked;
    });
</script>
{% endblock %}
