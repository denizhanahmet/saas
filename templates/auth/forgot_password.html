{% extends "base.html" %}
{% block title %}Şifremi Unuttum{% endblock %}
{% block content %}
<div
    class="w-full max-w-md mx-auto bg-white dark:bg-gray-800 rounded-xl shadow-lg p-8 border border-gray-200 dark:border-gray-700 mt-12 transition-colors duration-200">
    <h2 class="text-2xl font-bold text-center text-blue-700 dark:text-blue-400 mb-6">Şifremi Unuttum</h2>
    <form method="POST" class="space-y-5">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        <div>
            <label for="email" class="block text-gray-700 dark:text-gray-300 font-medium mb-1">Kayıtlı E-posta
                Adresi</label>
            <input type="email" id="email" name="email" required
                class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded focus:outline-none focus:ring-2 focus:ring-blue-400 bg-white dark:bg-gray-700 text-gray-900 dark:text-white" />
        </div>
        <button type="submit"
            class="w-full py-2 rounded bg-blue-600 text-white font-semibold hover:bg-blue-700 transition flex items-center justify-center gap-2">
            <span class="material-icons align-middle">mail</span>
            Şifre Yenileme Bağlantısı Gönder
        </button>
    </form>
</div>
{% endblock %}
