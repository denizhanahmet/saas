{% extends "base.html" %}
{% block title %}Yeni Randevu - Randevu Sistemi{% endblock %}
{% block content %}
<div
    class="w-full max-w-2xl mx-auto bg-white dark:bg-gray-800 rounded-xl shadow-lg p-8 border border-gray-200 dark:border-gray-700 mt-8 transition-colors duration-200">
    <h2 class="text-2xl font-bold text-center text-blue-700 dark:text-blue-400 mb-6">Yeni Randevu Oluştur</h2>
    <form method="POST" id="appointmentForm" class="space-y-5">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="flex gap-4">
            <div class="w-2/3">
                <label for="title" class="block text-gray-700 dark:text-gray-300 font-medium mb-1">Randevu Başlığı
                    *</label>
                <input type="text" id="title" name="title" required placeholder="Örn: Doktor Randevusu"
                    value="{{ request.form.title if request.form.title }}"
                    class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded focus:outline-none focus:ring-2 focus:ring-blue-400 bg-white dark:bg-gray-700 text-gray-900 dark:text-white" />
            </div>
            <div class="w-1/3">
                <label for="duration" class="block text-gray-700 dark:text-gray-300 font-medium mb-1">Süre (dakika)
                    *</label>
                <select id="duration" name="duration"
                    class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded focus:outline-none focus:ring-2 focus:ring-blue-400 bg-white dark:bg-gray-700 text-gray-900 dark:text-white">
                    <option value="30" {{ 'selected' if request.form.duration=='30' }}>30 dakika</option>
                    <option value="60" {{ 'selected' if request.form.duration=='60' or not request.form.duration }}>1
                        saat</option>
                    <option value="90" {{ 'selected' if request.form.duration=='90' }}>1.5 saat</option>
                    <option value="120" {{ 'selected' if request.form.duration=='120' }}>2 saat</option>
                    <option value="180" {{ 'selected' if request.form.duration=='180' }}>3 saat</option>
                </select>
            </div>
        </div>
        <div>
            <label for="description" class="block text-gray-700 dark:text-gray-300 font-medium mb-1">Açıklama</label>
            <textarea id="description" name="description" rows="3" placeholder="Randevu hakkında detaylar..."
                class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded focus:outline-none focus:ring-2 focus:ring-blue-400 bg-white dark:bg-gray-700 text-gray-900 dark:text-white">{{ request.form.description if request.form.description }}</textarea>
        </div>
        <div class="flex gap-4">
            <div class="w-1/2">
                <label for="appointment_date" class="block text-gray-700 dark:text-gray-300 font-medium mb-1">Tarih
                    *</label>
                <input type="date" id="appointment_date" name="appointment_date" required
                    value="{{ request.form.appointment_date if request.form.appointment_date }}"
                    class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded focus:outline-none focus:ring-2 focus:ring-blue-400 bg-white dark:bg-gray-700 text-gray-900 dark:text-white" />
            </div>
            <div class="w-1/2">
                <label for="appointment_time" class="block text-gray-700 dark:text-gray-300 font-medium mb-1">Saat
                    *</label>
                <input type="time" id="appointment_time" name="appointment_time" required
                    value="{{ request.form.appointment_time if request.form.appointment_time }}"
                    class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded focus:outline-none focus:ring-2 focus:ring-blue-400 bg-white dark:bg-gray-700 text-gray-900 dark:text-white" />
            </div>
        </div>
        <div>
            <label for="location" class="block text-gray-700 dark:text-gray-300 font-medium mb-1">Konum</label>
            <input type="text" id="location" name="location" placeholder="Örn: Hastane, Ofis, Online..."
                value="{{ request.form.location if request.form.location }}"
                class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded focus:outline-none focus:ring-2 focus:ring-blue-400 bg-white dark:bg-gray-700 text-gray-900 dark:text-white" />
        </div>
        <div>
            <label for="notes" class="block text-gray-700 dark:text-gray-300 font-medium mb-1">Notlar</label>
            <textarea id="notes" name="notes" rows="2" placeholder="Özel notlarınız..."
                class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded focus:outline-none focus:ring-2 focus:ring-blue-400 bg-white dark:bg-gray-700 text-gray-900 dark:text-white">{{ request.form.notes if request.form.notes }}</textarea>
        </div>
        <div id="conflictWarning" class="hidden bg-yellow-100 border-l-4 border-yellow-500 text-yellow-700 p-4 rounded"
            role="alert">
            <div class="flex items-center gap-2">
                <span class="material-icons">warning</span>
                <strong>Uyarı:</strong> <span id="conflictMessage"></span>
            </div>
        </div>
        <div class="flex justify-end gap-2 mt-6">
            <a href="{{ url_for('dashboard.dashboard') }}"
                class="px-6 py-2 rounded bg-gray-200 dark:bg-gray-600 text-gray-700 dark:text-gray-200 font-semibold hover:bg-gray-300 dark:hover:bg-gray-500 transition flex items-center gap-2"><span
                    class="material-icons align-middle">arrow_back</span>İptal</a>
            <button type="submit" class="btn-primary flex items-center gap-2 justify-center"
                style="background-color:#2563eb !important;color:#fff !important;border:2px solid #2563eb !important;width:auto !important;min-width:160px;box-shadow:0 2px 8px rgba(13,110,253,0.08);font-weight:700;min-height:44px;border-radius:8px;">
                <span class="material-icons align-middle">check_circle</span>Randevu Oluştur
            </button>
        </div>
    </form>
</div>
{% endblock %}
{% block extra_scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const form = document.getElementById('appointmentForm');
        const dateInput = document.getElementById('appointment_date');
        const timeInput = document.getElementById('appointment_time');
        const durationSelect = document.getElementById('duration');
        const conflictWarning = document.getElementById('conflictWarning');
        const conflictMessage = document.getElementById('conflictMessage');
        // Minimum tarih bugün olarak ayarla
        const today = new Date().toISOString().split('T')[0];
        dateInput.min = today;
        if (!dateInput.value) {
            dateInput.value = today;
        }
        function checkConflict() {
            const date = dateInput.value;
            const time = timeInput.value;
            const duration = durationSelect.value;
            if (!date || !time || !duration) return;
            fetch('{{ url_for("appointments.check_conflict") }}', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    date: date,
                    time: time,
                    duration: duration
                })
            })
                .then(response => response.json())
                .then(data => {
                    if (data.has_conflict) {
                        conflictMessage.textContent = `Bu saatte zaten "${data.conflicting_appointment.title}" randevunuz var (${data.conflicting_appointment.time})`;
                        conflictWarning.classList.remove('hidden');
                    } else {
                        conflictWarning.classList.add('hidden');
                    }
                })
                .catch(error => {
                    console.error('Çakışma kontrolü hatası:', error);
                });
        }
        dateInput.addEventListener('change', checkConflict);
        timeInput.addEventListener('change', checkConflict);
        durationSelect.addEventListener('change', checkConflict);
        form.addEventListener('submit', function (e) {
            checkConflict();
            if (!conflictWarning.classList.contains('hidden')) {
                e.preventDefault();
                alert('Çakışan randevu var! Lütfen farklı bir saat seçin.');
            }
        });
    });
</script>
{% endblock %}
