{% extends "base.html" %}
{% block title %}Randevu Düzenle{% endblock %}
{% block content %}
<div class="w-full max-w-2xl mx-auto rounded-xl shadow-lg p-8 border border-gray-200 mt-8 transition-colors duration-200"
    style="background-color: var(--bg-primary); color: var(--text-primary);">
    <h2 class="text-2xl font-bold text-center text-blue-700 dark:text-blue-400 mb-6">Randevu Düzenle</h2>
    <form method="POST" class="space-y-5">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="flex gap-4">
            <div class="w-1/2">
                <label for="title" class="block text-gray-700 dark:text-gray-300 font-medium mb-1">Başlık *</label>
                <input type="text" id="title" name="title" value="{{ appointment.title }}" required
                    class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400"
                    style="background-color: var(--bg-primary); color: var(--text-primary);" />
            </div>
            <div class="w-1/2">
                <label for="duration" class="block text-gray-700 dark:text-gray-300 font-medium mb-1">Süre
                    (dakika)</label>
                <input type="number" id="duration" name="duration" value="{{ appointment.duration }}" min="15" max="480"
                    class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400"
                    style="background-color: var(--bg-primary); color: var(--text-primary);" />
            </div>
        </div>
        <div class="flex gap-4">
            <div class="w-1/2">
                <label for="appointment_date" class="block text-gray-700 dark:text-gray-300 font-medium mb-1">Tarih
                    *</label>
                <input type="date" id="appointment_date" name="appointment_date"
                    value="{{ appointment.appointment_date if appointment.appointment_date else '' }}" required
                    class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400"
                    style="background-color: var(--bg-primary); color: var(--text-primary);" />
            </div>
            <div class="w-1/2">
                <label for="appointment_time" class="block text-gray-700 dark:text-gray-300 font-medium mb-1">Saat
                    *</label>
                <input type="time" id="appointment_time" name="appointment_time"
                    value="{% if appointment.appointment_time %}{% if appointment.appointment_time.strftime is defined %}{{ appointment.appointment_time.strftime('%H:%M') }}{% else %}{{ appointment.appointment_time }}{% endif %}{% else %}{% endif %}"
                    required
                    class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400"
                    style="background-color: var(--bg-primary); color: var(--text-primary);" />
            </div>
        </div>
        <div>
            <label for="client_id" class="block text-gray-700 dark:text-gray-300 font-medium mb-1">Müşteri</label>
            <select id="client_id" name="client_id"
                class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400"
                style="background-color: var(--bg-primary); color: var(--text-primary);">
                <option value="">Müşteri Seçin</option>
                {% for client in current_user.clients %}
                <option value="{{ client.id }}" {% if appointment.client_id==client.id %}selected{% endif %}>{{
                    client.name }} - {{ client.phone }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label for="location" class="block text-gray-700 dark:text-gray-300 font-medium mb-1">Konum</label>
            <input type="text" id="location" name="location" value="{{ appointment.location or '' }}"
                class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded focus:outline-none focus:ring-2 focus:ring-blue-400 bg-white dark:bg-gray-700 text-gray-900 dark:text-white" />
        </div>
        <div>
            <label for="description" class="block text-gray-700 dark:text-gray-300 font-medium mb-1">Açıklama</label>
            <textarea id="description" name="description" rows="3"
                class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded focus:outline-none focus:ring-2 focus:ring-blue-400 bg-white dark:bg-gray-700 text-gray-900 dark:text-white">{{ appointment.description or '' }}</textarea>
        </div>
        <div>
            <label for="notes" class="block text-gray-700 dark:text-gray-300 font-medium mb-1">Notlar</label>
            <textarea id="notes" name="notes" rows="3"
                class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded focus:outline-none focus:ring-2 focus:ring-blue-400 bg-white dark:bg-gray-700 text-gray-900 dark:text-white">{{ appointment.notes or '' }}</textarea>
        </div>
        <div>
            <label for="status" class="block text-gray-700 dark:text-gray-300 font-medium mb-1">Durum</label>
            <select id="status" name="status"
                class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded focus:outline-none focus:ring-2 focus:ring-blue-400 bg-white dark:bg-gray-700 text-gray-900 dark:text-white">
                <option value="scheduled" {% if appointment.status=='scheduled' %}selected{% endif %}>Planlandı</option>
                <option value="completed" {% if appointment.status=='completed' %}selected{% endif %}>Tamamlandı
                </option>
                <option value="cancelled" {% if appointment.status=='cancelled' %}selected{% endif %}>İptal Edildi
                </option>
            </select>
        </div>
        <div class="flex justify-end gap-2 mt-6">
            <button type="submit"
                class="px-6 py-2 rounded bg-green-600 text-white font-semibold hover:bg-green-700 transition flex items-center gap-2"><span
                    class="material-icons align-middle">save</span>Güncelle</button>
            <a href="{{ url_for('dashboard.view', appointment_id=appointment.id) }}"
                class="px-6 py-2 rounded bg-gray-200 dark:bg-gray-600 text-gray-700 dark:text-gray-200 font-semibold hover:bg-gray-300 dark:hover:bg-gray-500 transition flex items-center gap-2"><span
                    class="material-icons align-middle">close</span>İptal</a>
        </div>
    </form>
</div>
{% endblock %}
