{% extends "base.html" %}
{% block title %}Randevu Düzenle - Randevu Sistemi{% endblock %}
{% block content %}
<div class="w-full max-w-2xl mx-auto px-4 sm:px-6 animate-fade-in">

    <!-- Header -->
    <div class="mb-6">
        <a href="{{ url_for('dashboard.view', appointment_id=appointment.id) }}"
            class="inline-flex items-center gap-1 text-sm text-gray-500 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 transition-colors mb-3">
            <span class="material-icons text-sm">arrow_back</span>
            Randevu Detayı
        </a>
        <h1 class="text-2xl font-bold text-gray-900 dark:text-white flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-blue-100 dark:bg-blue-900/30 flex items-center justify-center">
                <span class="material-icons text-blue-600 dark:text-blue-400">edit_calendar</span>
            </div>
            Randevu Düzenle
        </h1>
    </div>

    <!-- Form Card -->
    <div class="card-modern p-6 sm:p-8">
        <form method="POST" class="space-y-6">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

            <!-- Başlık & Süre -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div class="sm:col-span-2">
                    <label for="title" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">
                        <span class="flex items-center gap-1.5">
                            <span class="material-icons text-sm text-gray-400">title</span>
                            Başlık <span class="text-red-500">*</span>
                        </span>
                    </label>
                    <input type="text" id="title" name="title" value="{{ appointment.title }}" required
                        placeholder="Örn: Doktor Randevusu" class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-xl
                                  focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent
                                  bg-white dark:bg-gray-700 text-gray-900 dark:text-white
                                  placeholder-gray-400 dark:placeholder-gray-500 transition-all" />
                </div>
                <div>
                    <label for="duration" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">
                        <span class="flex items-center gap-1.5">
                            <span class="material-icons text-sm text-gray-400">timer</span>
                            Süre (dk)
                        </span>
                    </label>
                    <input type="number" id="duration" name="duration" value="{{ appointment.duration }}" min="15"
                        max="480" class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-xl
                                  focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent
                                  bg-white dark:bg-gray-700 text-gray-900 dark:text-white transition-all" />
                </div>
            </div>

            <!-- Tarih & Saat -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="appointment_date"
                        class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">
                        <span class="flex items-center gap-1.5">
                            <span class="material-icons text-sm text-gray-400">calendar_today</span>
                            Tarih <span class="text-red-500">*</span>
                        </span>
                    </label>
                    <input type="date" id="appointment_date" name="appointment_date"
                        value="{{ appointment.appointment_date if appointment.appointment_date else '' }}" required
                        class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-xl
                                  focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent
                                  bg-white dark:bg-gray-700 text-gray-900 dark:text-white transition-all" />
                </div>
                <div>
                    <label for="appointment_time"
                        class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">
                        <span class="flex items-center gap-1.5">
                            <span class="material-icons text-sm text-gray-400">schedule</span>
                            Saat <span class="text-red-500">*</span>
                        </span>
                    </label>
                    <input type="time" id="appointment_time" name="appointment_time"
                        value="{% if appointment.appointment_time %}{% if appointment.appointment_time.strftime is defined %}{{ appointment.appointment_time.strftime('%H:%M') }}{% else %}{{ appointment.appointment_time }}{% endif %}{% endif %}"
                        required class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-xl
                                  focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent
                                  bg-white dark:bg-gray-700 text-gray-900 dark:text-white transition-all" />
                </div>
            </div>

            <!-- Konum -->
            <div>
                <label for="location" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">
                    <span class="flex items-center gap-1.5">
                        <span class="material-icons text-sm text-gray-400">location_on</span>
                        Konum
                    </span>
                </label>
                <input type="text" id="location" name="location" value="{{ appointment.location or '' }}"
                    placeholder="Örn: Hastane, Ofis, Online..." class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-xl
                              focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent
                              bg-white dark:bg-gray-700 text-gray-900 dark:text-white
                              placeholder-gray-400 dark:placeholder-gray-500 transition-all" />
            </div>

            <!-- Açıklama -->
            <div>
                <label for="description" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">
                    <span class="flex items-center gap-1.5">
                        <span class="material-icons text-sm text-gray-400">description</span>
                        Açıklama
                    </span>
                </label>
                <textarea id="description" name="description" rows="3" placeholder="Randevu hakkında detaylar..."
                    class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-xl
                                 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent
                                 bg-white dark:bg-gray-700 text-gray-900 dark:text-white
                                 placeholder-gray-400 dark:placeholder-gray-500 transition-all resize-none">{{ appointment.description or '' }}</textarea>
            </div>

            <!-- Notlar -->
            <div>
                <label for="notes" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">
                    <span class="flex items-center gap-1.5">
                        <span class="material-icons text-sm text-gray-400">sticky_note_2</span>
                        Notlar
                    </span>
                </label>
                <textarea id="notes" name="notes" rows="2" placeholder="Özel notlarınız..."
                    class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-xl
                                 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent
                                 bg-white dark:bg-gray-700 text-gray-900 dark:text-white
                                 placeholder-gray-400 dark:placeholder-gray-500 transition-all resize-none">{{ appointment.notes or '' }}</textarea>
            </div>

            <!-- Durum -->
            <div>
                <label for="status" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">
                    <span class="flex items-center gap-1.5">
                        <span class="material-icons text-sm text-gray-400">flag</span>
                        Durum
                    </span>
                </label>
                <select id="status" name="status" class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-xl
                               focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent
                               bg-white dark:bg-gray-700 text-gray-900 dark:text-white transition-all">
                    <option value="scheduled" {% if appointment.status=='scheduled' %}selected{% endif %}>📅 Planlandı
                    </option>
                    <option value="completed" {% if appointment.status=='completed' %}selected{% endif %}>✅ Tamamlandı
                    </option>
                    <option value="cancelled" {% if appointment.status=='cancelled' %}selected{% endif %}>❌ İptal Edildi
                    </option>
                </select>
            </div>

            <!-- Ayraç -->
            <div class="border-t border-gray-200 dark:border-gray-700"></div>

            <!-- Butonlar -->
            <div class="flex flex-col-reverse sm:flex-row items-center justify-end gap-3">
                <a href="{{ url_for('dashboard.view', appointment_id=appointment.id) }}" class="w-full sm:w-auto px-6 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600
                          text-gray-700 dark:text-gray-300 font-medium
                          hover:bg-gray-100 dark:hover:bg-gray-700 transition-all
                          text-center flex items-center justify-center gap-2">
                    <span class="material-icons text-sm">close</span>
                    İptal
                </a>
                <button type="submit" class="w-full sm:w-auto px-8 py-2.5 rounded-xl
                               bg-gradient-to-r from-blue-500 to-blue-600 text-white font-semibold
                               hover:from-blue-600 hover:to-blue-700
                               shadow-md hover:shadow-lg transition-all
                               flex items-center justify-center gap-2">
                    <span class="material-icons text-sm">save</span>
                    Güncelle
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
