{% extends "base.html" %}

{% block title %}Hata - Randevu İptali{% endblock %}

{% block content %}
<div class="w-full max-w-lg mx-auto px-4">
    <div class="card-modern p-8 animate-fade-in-up text-center">
        <!-- Error Icon -->
        <div
            class="w-20 h-20 mx-auto mb-6 rounded-full bg-gradient-to-br from-red-500 to-red-600 flex items-center justify-center shadow-lg">
            <span class="material-icons text-4xl text-white">error</span>
        </div>

        <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-2">İşlem Başarısız</h1>
        <p class="text-gray-500 dark:text-gray-400 mb-6">{{ error }}</p>

        <a href="/"
            class="btn-modern py-3 px-6 bg-gradient-to-r from-blue-500 to-blue-600 text-white hover:from-blue-600 hover:to-blue-700 inline-flex">
            <span class="material-icons">home</span>
            Ana Sayfaya Dön
        </a>
    </div>
</div>
{% endblock %}
